{% extends 'store/base.html' %}

{% block content %}
<div class="form-card">
    <h2>Reset Password</h2>
    <p class="form-subtitle">Changing password for <strong>{{ target_user.username }}</strong></p>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="password" required placeholder="Enter new password">
        </div>
        <button type="submit" class="btn-primary" style="width:100%; padding:13px; margin-top:8px;">Set Password →</button>
    </form>
    <p class="form-link"><a href="/manage-accounts/">← Back</a></p>
</div>
{% endblock %}
