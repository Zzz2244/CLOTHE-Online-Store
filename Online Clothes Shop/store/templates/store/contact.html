{% extends 'store/base.html' %}

{% block content %}
<div style="max-width:600px; margin:0 auto;">
    <h1 class="page-title">Contact Us</h1>
    <p class="page-subtitle">HAVE A QUESTION? WE'RE HERE TO HELP</p>

    <div class="form-card" style="max-width:100%;">
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required placeholder="Your name" value="{{ user.username }}">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required placeholder="your@email.com" value="{{ user.email }}">
            </div>
            <div class="form-group">
                <label>Subject</label>
                <input type="text" name="subject" required placeholder="What is your issue about?">
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea name="message" required rows="6" placeholder="Describe your issue in detail..."></textarea>
            </div>
            <button type="submit" class="btn-primary" style="width:100%; padding:13px;">Send Message →</button>
        </form>
    </div>
</div>
{% endblock %}
