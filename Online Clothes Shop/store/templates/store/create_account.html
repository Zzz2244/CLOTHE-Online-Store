{% extends 'store/base.html' %}

{% block content %}
<div class="form-card">
    <h2>Create Account</h2>
    <p class="form-subtitle">Create a new user or admin account</p>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Choose a username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Set a password">
        </div>
        <div class="form-group">
            <label>Role</label>
            <select name="role" style="width:100%; padding:11px 14px; border:1px solid var(--light-gray); font-family:'DM Sans',sans-serif; font-size:0.9rem; outline:none;">
                <option value="user">User</option>
                <option value="admin">Admin</option>
            </select>
        </div>
        <button type="submit" class="btn-accent" style="width:100%; padding:13px; margin-top:8px;">Create Account →</button>
    </form>
    <p class="form-link"><a href="/manage-accounts/">← Back</a></p>
</div>
{% endblock %}
